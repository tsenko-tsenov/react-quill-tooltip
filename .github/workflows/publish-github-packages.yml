name: Publish package to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@tsenko-tsenov"

      - run: npm ci

      # GitHub Packages requires the package name to be scoped to the repo
      # owner. The published-to-npmjs.org package stays unscoped, so this
      # rename only happens in the CI checkout, never committed back.
      - run: npm pkg set name="@tsenko-tsenov/react-quill-tooltip"

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
